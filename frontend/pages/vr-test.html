<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VR Test</title>
    <style>
      body { margin: 0; font-family: sans-serif; background: #0b1220; color: #fff; }
      .bar { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 9; display: flex; gap: 10px; align-items: center; }
      .btn { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
      #enterVr { background: #22c55e; color: #0b1220; }
      #status { background: rgba(0,0,0,0.45); padding: 8px 12px; border-radius: 10px; }
    </style>
    <script src="/static/js/vendor/aframe.min.js"></script>
</head>
  <body>
    <div class="bar">
      <button id="enterVr" class="btn">Enter VR</button>
      <div id="status">Loading scene...</div>
    </div>

    <a-scene id="scene" renderer="antialias: true; colorManagement: true" background="color: #60a5fa" vr-mode-ui="enabled: true">
      <a-entity id="rig" position="0 1.6 3">
        <a-camera>
          <a-entity light="type: point; intensity: 1.4; distance: 20; color: #ffffff" position="0 0 0"></a-entity>
        </a-camera>
      </a-entity>

      <a-entity light="type: ambient; intensity: 1.2; color: #ffffff"></a-entity>
      <a-entity light="type: directional; intensity: 1.1; color: #ffffff" position="1 3 2"></a-entity>
      <a-plane rotation="-90 0 0" width="24" height="24" color="#1e293b"></a-plane>
      <a-box position="0 1.2 -2" width="0.6" height="0.6" depth="0.6" color="#22d3ee"></a-box>
      <a-sky color="#60a5fa"></a-sky>
    </a-scene>

    <script>
      const sceneEl = document.getElementById('scene');
      const btn = document.getElementById('enterVr');
      const status = document.getElementById('status');

      function setStatus(text) { status.textContent = text; }

      function sceneReady() {
        const hasAframe = !!window.AFRAME;
        const hasScene = !!sceneEl;
        const hasEnterVR = !!(sceneEl && typeof sceneEl.enterVR === 'function');
        const loaded = !!(sceneEl && sceneEl.hasLoaded);

        if (!hasAframe) {
          setStatus('A-Frame script did not load');
          return;
        }
        if (!hasScene) {
          setStatus('Scene element is missing');
          return;
        }
        if (!hasEnterVR) {
          setStatus('Scene API not ready (enterVR missing)');
          return;
        }
        setStatus(loaded ? 'Ready' : 'Scene loaded slowly, but VR API is available');
      }

      sceneEl.addEventListener('loaded', sceneReady);
      const poll = setInterval(sceneReady, 1000);
      setTimeout(() => clearInterval(poll), 15000);

      btn.addEventListener('click', async () => {
        setStatus('Checking WebXR support...');
        try {
          if (!navigator.xr || typeof navigator.xr.isSessionSupported !== 'function') {
            setStatus('WebXR API is unavailable');
            return;
          }

          const supported = await navigator.xr.isSessionSupported('immersive-vr');
          if (!supported) {
            setStatus('immersive-vr is not supported in this context');
            return;
          }

          if (!window.AFRAME) {
            setStatus('A-Frame was not loaded in this browser');
            return;
          }
          if (typeof sceneEl.enterVR !== 'function') {
            setStatus('A-Frame scene API missing (enterVR)');
            return;
          }

          setStatus('Starting VR...');
          await sceneEl.enterVR();
          setStatus('VR started');
        } catch (e) {
          setStatus(`enterVR failed: ${e?.message || e}`);
        }
      });

      sceneEl.addEventListener('enter-vr', () => setStatus('Entered VR'));
      sceneEl.addEventListener('exit-vr', () => setStatus('Exited VR'));
    </script>
  </body>
</html>
