services:
  api:
    build:
      context: ./api
    env_file:
      - ./infra/.env.example
      - ./.env
    volumes:
      - ./:/workspace
    working_dir: /workspace/api
    command: >
      sh -c "alembic upgrade head && python -m app.scripts.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

